field.widget.settings.exo_number:
  type: field.widget.settings.number
  label: 'eXo number widget settings'
  mapping:
    step:
      type: string
      label: 'Step'

field.widget.settings.address_exo:
  type: field.widget.settings.address_default
  label: 'eXo address widget settings'
  mapping:
    wrapper:
      type: string
      label: 'Wrapper'
    force_address:
      type: boolean
      label: 'Force address'
    hidden:
      type: sequence
      label: 'Hidden address fields'
      sequence:
        type: string
        label: 'Field'

exo_form.settings:
  type: config_object
  label: 'eXo Form settings'
  mapping:
    exo_default:
      type: integer
      label: 'Use eXo form by default'
    exo_preset:
      type: string
      label: 'Preset'
    theme:
      type: string
      label: 'Theme'
    style:
      type: string
      label: 'Form style'
    description_display:
      type: string
      label: 'Description display'
    wrap:
      type: integer
      label: 'Wrap'
    themes:
      # Per-theme overrides produced by a pluggable eXo settings form.
      type: ignore
      label: 'Theme overrides'
